[project]
name = "northstar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sus194", email = "sukhrajpurewal14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dateutil>=2.9.0.post0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# DTZ rules assume every date-ish value should carry a timezone. Northstar
# deliberately keeps trading dates as plain `datetime.date` (calendar
# dates have no timezone component to attach) and reserves timezone-aware
# `datetime` for actual timestamps (ingested_at, sent_at, etc.), which
# already use datetime.now(UTC) throughout.
ignore = ["DTZ007", "DTZ011"]
